name: Publicar nueva versión (Windows)

# Se ejecuta solo a demanda: Actions > "Publicar nueva versión (Windows)" > Run workflow
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Nueva versión (ej. 1.1.0). Tiene que ser mayor a la actual.'
        required: true
        type: string
      notes:
        description: 'Novedades de esta versión (opcional)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      NEW_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validar versión
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          if ! [[ "$NEW_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::La versión '$NEW_VERSION' no es válida. Usá el formato X.Y.Z (ej. 1.1.0)."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$NEW_VERSION" >/dev/null; then
            echo "::error::Ya existe el tag v$NEW_VERSION."
            exit 1
          fi
          if gh release view "v$NEW_VERSION" >/dev/null 2>&1; then
            echo "::error::Ya existe un Release v$NEW_VERSION (puede ser un borrador). Borralo o usá otra versión."
            exit 1
          fi
          HIGHEST=$(printf '%s\n%s\n' "$CURRENT_VERSION" "$NEW_VERSION" | sort -V | tail -n1)
          if [ "$NEW_VERSION" = "$CURRENT_VERSION" ] || [ "$HIGHEST" != "$NEW_VERSION" ]; then
            echo "::error::La versión $NEW_VERSION tiene que ser mayor a la actual ($CURRENT_VERSION)."
            exit 1
          fi
          echo "Versión actual: $CURRENT_VERSION -> nueva: $NEW_VERSION"

      - name: Actualizar versión en package.json
        shell: bash
        run: npm version "$NEW_VERSION" --no-git-tag-version

      - name: Install dependencies
        run: npm ci

      # Se guarda la versión en main antes de crear el Release, así el tag apunta a este commit
      - name: Guardar versión en main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Release v$NEW_VERSION"
          git push origin HEAD:main

      # Se crea el Release como borrador ANTES del build: así el instalador y el portable
      # suben sus archivos al mismo Release (si no, los dos intentan crearlo a la vez y falla).
      - name: Crear Release en borrador
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          gh release create "v$NEW_VERSION" --draft --target "$(git rev-parse HEAD)" --title "$NEW_VERSION" --notes "${RELEASE_NOTES:-Versión $NEW_VERSION}"

      - name: Build y subir archivos al Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run electron:build -- --publish always

      - name: Verificar archivos de actualización
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSETS=$(gh release view "v$NEW_VERSION" --json assets --jq '.assets[].name')
          echo "$ASSETS"
          for REQUIRED in "latest.yml" "Tiker-Cotizador-Setup-$NEW_VERSION.exe" "Tiker-Cotizador-Setup-$NEW_VERSION.exe.blockmap"; do
            if ! grep -qx "$REQUIRED" <<< "$ASSETS"; then
              echo "::error::Falta $REQUIRED en el Release."
              exit 1
            fi
          done

      # Recién acá la versión queda visible para las apps instaladas (y se crea el tag)
      - name: Publicar Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v$NEW_VERSION" --draft=false --latest

      # Si algo falló antes de publicar, se borra el borrador para poder reintentar con la misma versión
      - name: Limpiar borrador si falló
        if: ${{ failure() }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IS_DRAFT=$(gh release view "v$NEW_VERSION" --json isDraft --jq '.isDraft' 2>/dev/null || echo "")
          if [ "$IS_DRAFT" = "true" ]; then
            gh release delete "v$NEW_VERSION" --yes --cleanup-tag
            echo "Se borró el borrador v$NEW_VERSION. Revisá el error y volvé a correr el workflow."
          fi
